name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Setup FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v3
      with:
        ffmpeg-version: release

    - name: Install Project Dependencies
      run: npm install

    - name: Generate Prisma Client (28 Models)
      run: npx prisma generate

    - name: Build Frontend Client (React)
      run: npm run build --prefix client

    - name: Build Backend Server (Express + TypeScript)
      run: npm run build --prefix server

    - name: Run 16/16 Unit Tests
      run: npm run test:unit

    - name: Run FFmpeg Media Smoke Test
      run: npm run test:media

    - name: Run Release Engineering Verification
      run: npm run release:check
